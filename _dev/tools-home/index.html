  :root{
    --ink:#101B33; --ink-soft:#4B5670; --paper:#F1F3F9; --card:#FFFFFF; --line:#E1E4EC;
    --brand:#2A4DFF; --brand-soft:#EAF0FF; --brand-text:#1E3ACC;
    --teal:#0E9488; --violet:#7C3AED;
    --slate:#8B94A7; --slate-soft:#EEF0F4; --slate-text:#5B6478;
    --logo-navy:#0D314C; --logo-blue:#74BFEB;
    --wordmark:var(--logo-blue);
    --radius:14px;
  }
  html[data-theme="dark"]{
    --ink:#E8EAF0; --ink-soft:#A0A8C0; --paper:#0B0F1C; --card:#161C30; --line:#2A3150;
    --brand:#5B85FF; --brand-soft:#1A2745; --brand-text:#9AB8FF;
    --teal:#14B8A6; --violet:#9660F5;
    --slate:#6B7488; --slate-soft:#202536; --slate-text:#A0A8C0;
  }
  *{box-sizing:border-box;}
  ::selection{background:var(--brand); color:#fff;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Libre Franklin',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    transition:background .2s ease, color .2s ease;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--brand); outline-offset:3px; border-radius:4px;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }

  /* ---------- masthead ---------- */
  .mh{padding:34px 24px 28px; background:var(--card); border-bottom:1px solid var(--line); transition:background .2s ease, border-color .2s ease;}
  .mh-in{max-width:1180px; margin:0 auto; display:flex; align-items:flex-start; justify-content:space-between; gap:28px;}
  .lockup{display:flex; align-items:center; gap:13px;}
  /* The mark is 708x108, cropped tight to its cap height, so setting a height here sets
     the cap height. "Tools" is then sized to the same cap height rather than the same
     font-size, which is what makes the two read as one word. */
  .logo{height:36px; width:auto; display:block;}
  .logo-white{display:none;}
  html[data-theme="dark"] .logo-colour{display:none;}
  html[data-theme="dark"] .logo-white{display:block;}
  .word{
    font-family:'Archivo Black',Impact,'Arial Black',sans-serif; font-weight:400;
    /* Sized so the INK BOX matches the wordmark's, which is what the eye compares.
       Three measurements decide this number. The tallest ink in "Tools" is the l's
       ascender (0.735em), not the T (0.705em). The round o and s overshoot the
       baseline by a further 0.018em. And the wordmark itself is not flat-bottomed:
       its O overshoots its M by about 3% at each end, so the logo's 36px height
       already includes an overshoot of its own. 36 / (0.735 + 0.018) = 47.8px.
       That also lands the T within 0.6px of the M's cap height, so the flat letters
       agree too. No vertical nudge — one was pushing the word down and turning the
       natural overshoot into a visible step. */
    font-size:47.8px;
    line-height:1; color:var(--wordmark); letter-spacing:-.005em;
  }
  html[data-theme="dark"] .word{color:var(--logo-blue);}
  .tagline{font-size:14.5px; color:var(--ink-soft); margin:15px 0 0; max-width:62ch; line-height:1.6;}
  .theme-toggle{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); cursor:pointer; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .theme-toggle:hover{background:var(--brand-soft); border-color:var(--brand); color:var(--brand-text);}
  .theme-toggle svg{width:19px; height:19px;}
  .theme-toggle .moon{display:none;}
  html[data-theme="dark"] .theme-toggle .sun{display:none;}
  html[data-theme="dark"] .theme-toggle .moon{display:block;}

  /* ---------- layout ---------- */
  .wrap{max-width:1180px; margin:0 auto; padding:30px 24px 80px;}
  .cols{display:grid; grid-template-columns:200px 1fr; gap:44px; align-items:start;}

  .rail{position:sticky; top:20px;}
  .rail-top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .rail-h{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--slate-text);}
  .rail-all{background:none; border:none; padding:0; cursor:pointer; font-size:11.5px; font-weight:600; color:var(--brand-text);}
  .rail-all:hover{text-decoration:underline;}
  .rail a{display:flex; align-items:center; gap:9px; padding:7px 0; text-decoration:none; font-size:13.5px; font-weight:600; color:var(--ink-soft);}
  .rail a:hover{color:var(--ink);}
  .rail .dot{width:7px; height:7px; border-radius:50%; background:var(--c); flex:0 0 auto;}
  .rail .n{margin-left:auto; font-size:11.5px; color:var(--slate);}

  /* ---------- a tool ---------- */
  .sec{margin-bottom:26px; scroll-margin-top:20px;}
  .head{display:flex; align-items:center; gap:12px; padding-bottom:10px; border-bottom:2px solid var(--c);}
  .toggle{background:none; border:none; cursor:pointer; padding:5px; margin-left:-5px; color:var(--ink-soft); display:flex; flex:0 0 auto;}
  .toggle:hover{color:var(--ink);}
  .chev{transition:transform .18s ease;}
  .sec[data-open="false"] .chev{transform:rotate(-90deg);}
  .sec[data-open="false"] .body{display:none;}
  .title{font-size:19px; font-weight:700; letter-spacing:-.01em; text-decoration:none;}
  .title:hover{text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--c);}
  .meta{margin-left:auto; font-size:12px; color:var(--ink-soft); text-align:right; flex:0 0 auto;}
  .desc{font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin:11px 0 0; max-width:70ch;}
  /* The way in to a tool: same card, but tinted with the tool's colour, a heavier
     edge, and a house mark rather than a three-letter badge. One row per tool, so the
     extra emphasis stays rare enough to mean something. */
  .row.home{
    background:color-mix(in srgb, var(--c) 8%, var(--card));
    border-left-width:4px; margin-bottom:9px;
  }
  .row.home:hover{background:color-mix(in srgb, var(--c) 14%, var(--card));}
  html[data-theme="dark"] .row.home{background:color-mix(in srgb, var(--c) 17%, var(--card));}
  html[data-theme="dark"] .row.home:hover{background:color-mix(in srgb, var(--c) 26%, var(--card));}
  .row.home .n{font-size:14.5px; font-weight:700;}
  .b-home{display:flex; align-items:center; justify-content:center; color:var(--c);}

  .body .grp:first-child{margin-top:0;}
  .sec .row.home{margin-bottom:0;}
  .sec[data-open="true"] .row.home{margin-bottom:14px;}
  .body .row:last-child{margin-bottom:0;}
  .grp{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--slate-text); margin:17px 0 8px;}

  /* Each page is its own card with a coloured left edge. The edge ties the row back to
     the tool it belongs to, which is what keeps a long scroll organised once several
     tools are expanded at once. */
  .row{
    display:flex; align-items:center; gap:14px; text-decoration:none;
    padding:12px 14px 12px 13px; margin-bottom:7px;
    background:var(--card); border:1px solid var(--line); border-left:3px solid var(--c);
    border-radius:10px; transition:box-shadow .15s ease, border-color .15s ease;
  }
  .row:hover{box-shadow:0 2px 10px rgba(16,27,51,.09);}
  html[data-theme="dark"] .row:hover{box-shadow:0 2px 10px rgba(0,0,0,.4);}
  .row .b{width:48px; flex:0 0 auto; font-size:10.5px; font-weight:700; color:var(--slate-text);}
  .row[data-t="app"] .b{color:var(--c);}
  .row .n{font-size:14px; font-weight:600; display:block;}
  .row .s{font-size:12px; color:var(--ink-soft); margin-top:2px; display:block;}
  .tag{margin-left:auto; flex:0 0 auto; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:3px 7px; border-radius:5px; background:var(--brand-soft); color:var(--brand-text);}
  .row[data-state="planned"]{opacity:.6; pointer-events:none;}
  .note{font-size:13px; color:var(--ink-soft); line-height:1.6; margin:12px 0 4px; max-width:70ch;}
  .soon .title{color:var(--ink-soft);}

  .foot{max-width:1180px; margin:0 auto; padding:0 24px 60px; font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
  .foot code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; background:var(--slate-soft); padding:1.5px 5px; border-radius:4px;}

  @media (max-width:820px){
    .cols{grid-template-columns:1fr; gap:24px;}
    .rail{position:static;}
    .mh-in{flex-wrap:wrap;}
    .logo{height:28px;} .word{font-size:37.2px;}
  }
</style>

</div>
<p class="foot" id="foot"></p>

<script>
/* ===================================================================
   THE ONLY THING TO EDIT WHEN A TOOL IS ADDED, MOVED OR RETIRED.

   base    folder under tools.mismo.org. The path IS the repository name,
           so changing one means renaming the repo too.
   home    one line describing the tool's landing page. The row is always labelled
           "Home page" and always links to base + '/', so neither can drift out of
           step with the title above it. Omit for a tool that is not live yet.
   colour  a CSS variable name; pick an unused one for a new tool.
   state   'soon' renders the tool without links and with no page count.
   groups  optional headings inside a tool. Omit for a flat list.
   tag     'gated' marks a page that asks for a facilitator passcode.
   =================================================================== */
var APPS = [
  {
    key:'hub', name:'Initiative Hub', base:'/initiative-hub', colour:'brand',
    desc:'Workgroup dashboards, the meeting calendar, and initiatives still under consideration.',
    home:'Every initiative, by domain, plus the meeting calendar',
    groups:[
      { label:'Active initiatives', pages:[
        { badge:'MCD',  name:'Mortgage Compliance Dataset',      sub:'Workgroup dashboard', href:'/mcd-dashboard.html',  primary:true },
        { badge:'LBDS', name:'Loan Boarding Data Segment',       sub:'Workgroup dashboard', href:'/lbds-dashboard.html', primary:true },
        { badge:'CCS',  name:'Common Confidence Score',          sub:'Workgroup dashboard', href:'/ccs-dashboard.html',  primary:true },
        { badge:'TPA',  name:'Tri-Party eNote Bailee Agreement', sub:'Workgroup dashboard', href:'/tpa-dashboard.html',  primary:true }
      ]},
      { label:'Potential initiatives', pages:[
        { badge:'AI',  name:'Consumer Facing AI Disclosure Language', sub:'Artificial Intelligence, in progress',
          href:'/potential.html?id=consumer-facing-ai-disclosure-language' },
        { badge:'NEW', name:'Log a potential initiative', sub:'Upload and review', href:'/potential-edit.html', tag:'gated' }
      ]},
      { label:'Schedule', pages:[
        { badge:'CAL', name:'Meeting calendar', sub:'Every workgroup, filterable', href:'/calendar.html' }
      ]},
      { label:'Facilitator tools', pages:[
        { badge:'ADM', name:'Admin panel', sub:'Facilitator keys and stakeholder types', href:'/admin.html',      tag:'gated' },
        { badge:'KEY', name:'Key helper',  sub:'Generate a facilitator passcode',        href:'/key-helper.html', tag:'gated' }
      ]}
    ]
  },
  {
    key:'glossary', name:'Business Glossary', base:'/glossary', colour:'teal',
    desc:'Every MISMO business term, its definition and where it is used.',
    home:'Search and browse every term',
    groups:[
      { label:'Facilitator tools', pages:[
        { badge:'CON', name:'Glossary console', sub:'Draft, stage and publish changes', href:'/console/', tag:'gated' }
      ]}
    ]
  },
  {
    key:'sponsorship', name:'Sponsorship Prospectus', base:'/sponsorship', colour:'violet',
    state:'soon',
    desc:'Sponsorship tiers, what each one includes, and who currently sponsors MISMO.',
    note:'In development. It will be listed here as soon as there is something to open.'
  }
];

/* --------- nothing below needs editing to add a tool --------- */

/* Sorted here rather than by hand, so a tool added anywhere in APPS still appears in
   the right place. localeCompare so "Émission" would file under E, not after Z. */
APPS.sort(function(a,b){ return a.name.localeCompare(b.name, 'en'); });
var STORE = 'tools:home:collapsed';
var CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* Which tools the reader left open. Sections start collapsed, so this only ever
   re-opens what someone chose. Wrapped because storage can be unavailable. */
function openSet(){
  try { return new Set(JSON.parse(localStorage.getItem(STORE) || '[]')); }
  catch (e) { return new Set(); }
}
function remember(set){
  try { localStorage.setItem(STORE, JSON.stringify(Array.from(set))); } catch (e) {}
}

function countPages(app){
  return (app.home ? 1 : 0) +
    (app.groups || []).reduce(function(n,g){ return n + g.pages.length; }, 0);
}

function rowHTML(app, page){
  var planned = page.state === 'planned';
  var tag = page.tag === 'gated' ? '<span class="tag">Facilitator</span>' : '';
  var inner =
    '<span class="b">' + esc(page.badge || '') + '</span>' +
    '<span><span class="n">' + esc(page.name) + '</span>' +
    (page.sub ? '<span class="s">' + esc(page.sub) + '</span>' : '') + '</span>' + tag;
  var attrs = (page.primary ? ' data-t="app"' : '') + (planned ? ' data-state="planned"' : '');
  return planned
    ? '<div class="row"' + attrs + '>' + inner + '</div>'
    : '<a class="row"' + attrs + ' href="' + esc(app.base + page.href) + '">' + inner + '</a>';
}

/* The landing page of a tool is not one page among several — it is the way in, so it
   sits OUTSIDE the collapsing region, next to the description. Collapsed, a tool says
   what it is and offers the door; expanding is only for the pages behind it. It carries
   the tool's own tint and a house mark rather than a three-letter badge. Its href is
   built from base, never typed, so it always agrees with the title link above it. */
var HOME_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>';

function homeHTML(app){
  return '<a class="row home" href="' + esc(app.base) + '/">' +
    '<span class="b b-home">' + HOME_ICON + '</span>' +
    '<span><span class="n">Home page</span>' +
    '<span class="s">' + esc(app.home) + '</span></span>' +
    '</a>';
}

function secHTML(app, isOpen){
  var soon = app.state === 'soon';
  var n = countPages(app);
  var meta = soon ? 'Coming soon' : n + (n === 1 ? ' page' : ' pages') + ' &middot; ' + esc(app.base) + '/';
  var title = soon
    ? '<span class="title">' + esc(app.name) + '</span>'
    : '<a class="title" href="' + esc(app.base) + '/">' + esc(app.name) + '</a>';

  var body = '';
  (app.groups || []).forEach(function(g){
    if (g.label) body += '<p class="grp">' + esc(g.label) + '</p>';
    g.pages.forEach(function(p){ body += rowHTML(app, p); });
  });
  if (app.note) body += '<p class="note">' + esc(app.note) + '</p>';

  return '<section class="sec' + (soon ? ' soon' : '') + '" id="sec-' + esc(app.key) + '"' +
    ' data-key="' + esc(app.key) + '" data-open="' + (isOpen ? 'true' : 'false') + '"' +
    ' style="--c:var(--' + esc(app.colour) + ')">' +
      '<div class="head">' +
        '<button class="toggle" aria-expanded="' + (isOpen ? 'true' : 'false') +
          '" aria-controls="body-' + esc(app.key) + '"' +
          ' aria-label="' + (isOpen ? 'Hide' : 'Show') + ' pages in ' + esc(app.name) + '">' + CHEV + '</button>' +
        title +
        '<span class="meta">' + meta + '</span>' +
      '</div>' +
      '<p class="desc">' + esc(app.desc) + '</p>' +
      (app.home ? homeHTML(app) : '') +
      '<div class="body" id="body-' + esc(app.key) + '">' + body + '</div>' +
    '</section>';
}

(function render(){
  var open = openSet();

  document.getElementById('list').innerHTML =
    APPS.map(function(a){ return secHTML(a, open.has(a.key)); }).join('');

  document.getElementById('rail').innerHTML =
    '<div class="rail-top"><span class="rail-h">Tools</span>' +
    '<button class="rail-all" id="allBtn"></button></div>' +
    APPS.map(function(a){
      var n = a.state === 'soon' ? '&mdash;' : countPages(a);
      return '<a href="#sec-' + esc(a.key) + '" data-jump="' + esc(a.key) + '" style="--c:var(--' + esc(a.colour) + ')">' +
        '<span class="dot"></span>' + esc(a.name) + '<span class="n">' + n + '</span></a>';
    }).join('');

  var pages = APPS.reduce(function(n,a){ return n + countPages(a); }, 0);
  var live = APPS.filter(function(a){ return a.state !== 'soon'; }).length;
  document.getElementById('foot').innerHTML =
    live + ' tools, ' + pages + ' pages, plus ' + (APPS.length - live) + ' on the way. ' +
    'To add a tool, add one entry to <code>APPS</code> at the top of this file.';

  function setOpen(sec, want){
    sec.setAttribute('data-open', want ? 'true' : 'false');
    var btn = sec.querySelector('.toggle');
    btn.setAttribute('aria-expanded', want ? 'true' : 'false');
    btn.setAttribute('aria-label', (want ? 'Hide' : 'Show') + ' pages in ' +
      sec.querySelector('.title').textContent);
    var set = openSet();
    if (want) set.add(sec.dataset.key); else set.delete(sec.dataset.key);
    remember(set);
    syncAll();
  }

  document.querySelectorAll('.toggle').forEach(function(btn){
    btn.addEventListener('click', function(){
      var sec = btn.closest('.sec');
      setOpen(sec, sec.getAttribute('data-open') !== 'true');
    });
  });

  // Jumping from the rail opens that tool, otherwise the anchor lands on a closed row.
  document.querySelectorAll('[data-jump]').forEach(function(a){
    a.addEventListener('click', function(){
      var sec = document.getElementById('sec-' + a.dataset.jump);
      if (sec && sec.getAttribute('data-open') !== 'true') setOpen(sec, true);
    });
  });

  var allBtn = document.getElementById('allBtn');
  function syncAll(){
    var secs = Array.from(document.querySelectorAll('.sec'));
    var anyClosed = secs.some(function(s){ return s.getAttribute('data-open') !== 'true'; });
    allBtn.textContent = anyClosed ? 'Expand all' : 'Collapse all';
    allBtn.dataset.want = anyClosed ? 'open' : 'close';
  }
  allBtn.addEventListener('click', function(){
    var want = allBtn.dataset.want === 'open';
    document.querySelectorAll('.sec').forEach(function(s){ setOpen(s, want); });
  });
  syncAll();
})();

(function theme(){
  document.getElementById('themeBtn').addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme','dark');
    try { localStorage.setItem('tools:home:theme', dark ? 'light' : 'dark'); } catch (e) {}
  });
})();
</script>
</body>
</html>
