<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISMO Initiative Hub</title>
<script>
  // Set the theme before any CSS paints, so a dark-mode visitor doesn't see a flash
  // of the light theme first. This is deliberately tiny and synchronous — it just
  // reads localStorage and sets an attribute, nothing else — so it can't meaningfully
  // delay first paint the way the full page script (loaded later) would.
  (function(){
    try {
      var saved = localStorage.getItem('tools:hub:theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101B33; --ink-soft:#4B5670; --paper:#F1F3F9; --card:#FFFFFF; --line:#E1E4EC;
    --brand:#2A4DFF; --brand-soft:#EAF0FF; --brand-text:#1E3ACC;
    --teal:#0E9488; --gold:#D97706; --rose:#C2255C; --violet:#7C3AED; --fuchsia:#C026D3; --graphite:#475569; --emerald:#059669; --cyan:#0891B2;
    --indigo:#4F46E5; --crimson:#9F1239;
    --success-soft:#E7F7EE; --success-text:#157A44;
    --slate:#8B94A7; --slate-soft:#EEF0F4; --slate-text:#5B6478;
    --header-bg:#101B33; --header-text:#fff;
    --radius:14px; --shadow:0 1px 2px rgba(16,27,51,.04), 0 4px 14px rgba(16,27,51,.05);
  }
  html[data-theme="dark"]{
    --ink:#E8EAF0; --ink-soft:#A0A8C0; --paper:#0B0F1C; --card:#161C30; --line:#2A3150;
    --brand:#5B85FF; --brand-soft:#1A2745; --brand-text:#9AB8FF;
    --teal:#14B8A6; --gold:#F0930D; --rose:#E0417A; --violet:#9660F5; --fuchsia:#D946E4; --graphite:#64748B; --emerald:#22C55E; --cyan:#22D3EE;
    --success-soft:#123024; --success-text:#4ADE80;
    --slate:#6B7488; --slate-soft:#202536; --slate-text:#A0A8C0;
    --header-bg:#F1F3F9; --header-text:#101B33;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  ::selection{background:var(--brand); color:#fff;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:'Libre Franklin',sans-serif;
    transition:background .2s ease, color .2s ease;
  }
  .masthead{padding:36px 24px 24px; background:var(--card); border-bottom:1px solid var(--line); transition:background .2s ease, border-color .2s ease;}
  .masthead-inner{max-width:1455px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;}
  .eyebrow-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .sponsor-mark{font-family:'Libre Franklin',sans-serif; font-weight:700; font-size:11px; letter-spacing:.06em; background:var(--header-bg); color:var(--header-text); padding:3px 8px; border-radius:4px;}
  .eyebrow{font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);}
  h1{font-size:30px; font-weight:700; margin:0;}
  .subtitle{font-size:14px; color:var(--ink-soft); max-width:560px; margin-top:8px;}
  .calendar-link{
    display:flex; align-items:center; gap:12px; flex:0 0 auto;
    background:var(--brand-soft); border:1px solid var(--brand); border-radius:var(--radius);
    padding:14px 20px; text-decoration:none; color:var(--brand-text);
  }
  .calendar-link:hover{background:var(--brand); color:#fff;}
  .calendar-link svg{flex:0 0 auto;}
  .calendar-link-text{display:flex; flex-direction:column; gap:1px;}
  .calendar-link-title{font-family:'Libre Franklin',sans-serif; font-weight:700; font-size:13.5px;}
  .calendar-link-sub{font-size:11px; opacity:.8;}
  .masthead-actions{display:flex; flex-direction:column; align-items:flex-end; gap:10px; flex:0 0 auto;}
  .masthead-actions-row{display:flex; align-items:center; gap:10px;}
  .theme-toggle{
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); cursor:pointer; transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .theme-toggle:hover{background:var(--brand-soft); border-color:var(--brand); color:var(--brand-text);}
  a.theme-toggle{text-decoration:none;}   /* the admin link shares the circle style */
  .theme-toggle svg{width:20px; height:20px;}
  .theme-toggle .icon-moon{display:none;}
  html[data-theme="dark"] .theme-toggle .icon-sun{display:none;}
  html[data-theme="dark"] .theme-toggle .icon-moon{display:block;}

  .wrap{max-width:1455px; margin:0 auto; padding:28px 24px 70px;}

  /* Top-level section switch. Sized to read as primary navigation rather than a
     filter control - these two are the main division of the site, so they carry
     more weight than the domain tiles beneath them. */
  .hub-tabs{display:flex; gap:10px; margin-bottom:22px; border-bottom:2px solid var(--line); padding-bottom:0;}
  .hub-tab{
    background:none; border:none; cursor:pointer; white-space:nowrap;
    font-family:'Libre Franklin',sans-serif; font-size:17px; font-weight:700;
    color:var(--ink-soft); padding:12px 22px 14px;
    border-bottom:3px solid transparent; margin-bottom:-2px;
    display:flex; align-items:center; gap:9px;
  }
  .hub-tab:hover:not(.active){color:var(--ink); background:var(--paper); border-radius:8px 8px 0 0;}
  .hub-tab.active{color:var(--brand-text); border-bottom-color:var(--brand);}
  .hub-tab .tab-count{
    font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;
    background:var(--line); color:var(--ink-soft); padding:2px 9px; border-radius:999px;
  }
  .hub-tab.active .tab-count{background:var(--brand); color:#fff;}
  @media (max-width:620px){
    .hub-tabs{gap:2px;}
    .hub-tab{font-size:15px; padding:11px 13px 13px;}
  }
  .hub-tab-placeholder{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:70px 24px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  .hub-tab-placeholder strong{display:block; font-family:'Libre Franklin',sans-serif; font-size:17px; color:var(--ink); margin-bottom:8px; font-weight:700;}

  /* Tile size restored to match the original mockup's markup exactly */
  .tile-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  @media (max-width:1200px){.tile-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:900px){.tile-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:500px){.tile-grid{grid-template-columns:1fr;}}

  .domain-tile{
    border:2px solid var(--line); border-radius:var(--radius); background:var(--card); cursor:pointer;
    padding:22px 22px 20px; display:flex; flex-direction:column; gap:14px; min-height:150px; text-align:left;
    transition:border-color .15s ease, transform .15s ease, background .2s ease;
  }
  .domain-tile:hover{transform:translateY(-2px);}
  .domain-tile.active{border-color:var(--tile-color); background:var(--tile-soft);}
  .domain-tile.intro-highlight{border-color:var(--tile-color); background:var(--tile-soft); transition:border-color .6s ease, background .6s ease;}
  .domain-tile.intro-highlight .tile-name{color:#101B33; transition:color .6s ease;}
  .domain-tile.intro-highlight .tile-desc{color:#4B5670; transition:color .6s ease;}
  .domain-tile.intro-highlight .tile-icon-wrap{background:var(--tile-color); color:#fff; transition:background .6s ease, color .6s ease;}
  /* Slower, more gradual fade for the descending row phase specifically —
     the quicker ascending phase keeps the snappier .6s transition above,
     since its 0.5s cadence doesn't leave room for a slower fade. */
  .domain-tile.intro-highlight-slow{border-color:var(--tile-color); background:var(--tile-soft); transition:border-color .65s ease, background .65s ease;}
  .domain-tile.intro-highlight-slow .tile-name{color:#101B33; transition:color .65s ease;}
  .domain-tile.intro-highlight-slow .tile-desc{color:#4B5670; transition:color .65s ease;}
  .domain-tile.intro-highlight-slow .tile-icon-wrap{background:var(--tile-color); color:#fff; transition:background .65s ease, color .65s ease;}
  .tile-top-row{display:flex; align-items:center; gap:12px;}
  .tile-icon-wrap{
    width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    background:var(--tile-soft); color:var(--tile-color); transition:background .15s ease, color .15s ease;
  }
  .domain-tile.active .tile-icon-wrap{background:var(--tile-color); color:#fff;}
  .tile-icon-wrap svg{width:20px; height:20px;}
  .tile-name{font-family:'Libre Franklin',sans-serif; font-size:16.5px; font-weight:700; color:var(--ink);}
  .domain-tile.active .tile-name{color:#101B33;}
  .tile-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.5; flex:1;}
  .domain-tile.active .tile-desc{color:#4B5670;}
  .tile-count{
    display:inline-flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; font-family:'Libre Franklin',sans-serif; font-variant-numeric:tabular-nums;
    color:#fff; background:var(--tile-color); border:2px solid #fff;
    border-radius:999px; padding:3px 10px; width:fit-content;
  }

  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:26px 26px 24px; color:var(--ink); transition:background .2s ease, border-color .2s ease;
  }
  .panel-head{display:flex; align-items:center; gap:12px; margin-bottom:20px;}
  .panel-icon-wrap{
    width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    background:var(--tile-color);
  }
  .panel-icon-wrap svg{width:22px; height:22px; color:#fff;}
  .panel-title{font-family:'Libre Franklin',sans-serif; font-size:21px; font-weight:700; color:var(--ink);}
  .panel-sub{font-size:12.5px; color:var(--ink-soft);}

  .init-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media (max-width:1100px){.init-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:760px){.init-grid{grid-template-columns:1fr;}}

  .init-card{border:1px solid var(--line); border-radius:12px; padding:18px 19px; background:var(--paper); transition:background .2s ease, border-color .2s ease; display:flex; flex-direction:column;}
  .detail-block-grow{flex:1; min-height:0;}
  .init-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px;}
  .init-title{font-family:'Libre Franklin',sans-serif; font-size:15px; font-weight:700; color:var(--ink);}
  .badge-row{display:flex; gap:6px; flex-wrap:wrap; flex:0 0 auto;}
  .status-badge{
    font-size:9.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;
    background:var(--success-soft); color:var(--success-text); text-transform:uppercase; letter-spacing:.03em;
  }
  .status-badge.planned{background:var(--slate-soft); color:var(--slate-text);}
  .sample-badge{
    font-size:9.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    padding:3px 8px; border-radius:999px; border:1px dashed var(--slate); color:var(--slate-text);
    background:var(--card); white-space:nowrap;
  }

  .detail-block{margin-top:12px;}
  .detail-label{
    display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); margin-bottom:4px;
  }
  .detail-text{font-size:13px; color:var(--ink); margin:0; line-height:1.5;}
  .why-bullets{margin:0; padding-left:16px; font-size:13px; color:var(--ink); line-height:1.5;}
  .why-bullets li{margin-bottom:4px;}
  .why-bullets li:last-child{margin-bottom:0;}
  .snapshot-stat{
    display:inline-block; font-family:'Libre Franklin',sans-serif; font-variant-numeric:tabular-nums; font-size:11.5px;
    font-weight:600; background:var(--brand-soft); color:var(--brand-text); padding:4px 10px; border-radius:999px;
    width:fit-content; margin:0;
  }

  .card-actions-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .init-card.expanded .card-actions-row{order:10;}
  .expand-toggle{
    display:inline-flex; align-items:center; gap:5px; cursor:pointer; font-family:inherit;
    font-size:13px; font-weight:600; color:var(--brand-text);
    padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:transparent;
  }
  .expand-toggle:hover{border-color:var(--brand); background:var(--brand-soft);}
  .expand-chevron{font-size:10px; transition:transform .15s ease;}
  .expand-chevron.open{transform:rotate(180deg);}
  .expand-body{display:none;}
  .expand-body.open{display:block;}

  .view-link{
    display:inline-flex; align-items:center; gap:6px;
    padding:10px 18px; border-radius:8px; border:none;
    font-size:13px; font-weight:700; color:#fff; background:var(--brand);
    text-decoration:none; transition:background .15s ease, transform .15s ease;
  }
  .view-link:hover{background:var(--brand-text); transform:translateY(-1px);}
  .view-link-disabled{
    display:inline-flex; align-items:center;
    padding:10px 18px; border-radius:8px; border:1px dashed var(--line);
    font-size:13px; font-weight:700; color:var(--ink-soft); font-style:italic;
  }
  .empty-hint{font-size:13px; color:var(--ink-soft); text-align:center; padding:26px 0;}

  /* ---- Potential Initiatives tab ---- */
  .pot-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin:4px 0 16px;}
  .pot-head p{margin:4px 0 0; font-size:13.5px; color:var(--ink-soft); max-width:640px;}
  .pot-head h2{margin:0; font-family:'Libre Franklin',sans-serif; font-size:18px; font-weight:700;}
  .pot-new{display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px; background:var(--brand); color:#fff; font-weight:700; font-size:13.5px; text-decoration:none; white-space:nowrap; border:1px solid var(--brand);}
  .pot-new:hover{filter:brightness(1.08);}
  /* Potential cards reuse .init-card wholesale (option B): the only additions are the
     stage rail under the title and a card background, since these sit on the page
     rather than inside a domain panel. */
  .pot-grid .init-card{background:var(--card);}
  .steps{display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin:8px 0 2px;}
  .step{font-size:9.5px; font-weight:700; text-align:center; color:var(--slate); line-height:1.15;}
  .step::before{content:''; display:block; height:4px; border-radius:2px; background:var(--slate-soft); margin-bottom:4px;}
  .step.on{color:var(--brand-text);} .step.on::before{background:var(--brand);}
  .step.on.s-in-approvals{color:var(--gold);} .step.on.s-in-approvals::before{background:var(--gold);}
  .step.on.s-kickoff-set{color:var(--violet);} .step.on.s-kickoff-set::before{background:var(--violet);}
  .step.on.s-launched{color:var(--emerald);} .step.on.s-launched::before{background:var(--emerald);}
  .step.on.s-not-started{color:var(--slate-text);} .step.on.s-not-started::before{background:var(--slate);}
  .pot-empty{background:var(--card); border:1px dashed var(--line); border-radius:var(--radius); padding:48px 24px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  .pot-empty strong{display:block; font-family:'Libre Franklin',sans-serif; font-size:16px; color:var(--ink); margin-bottom:6px;}
</style>
  <script src="dashboard-data.js?v=268f4f6288"></script>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <div>
      <div class="eyebrow-row">
        <span class="sponsor-mark">MISMO</span>
        <span class="eyebrow">Initiative Library</span>
      </div>
      <h1>Welcome to the MISMO Initiative Hub</h1>
      <p class="subtitle">Explore active workgroup initiatives organized by domain — pick a domain below to see what's being built, who's involved, and how far along it is.</p>
    </div>
    <div class="masthead-actions">
      <a class="calendar-link" href="calendar.html">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <div class="calendar-link-text">
          <span class="calendar-link-title">Meeting Calendar</span>
          <span class="calendar-link-sub">See all workgroup schedules →</span>
        </div>
      </a>
      <div class="masthead-actions-row">
        <a class="theme-toggle" id="adminLink" href="admin.html" aria-label="Admin panel" title="Admin panel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </a>
        <button type="button" class="theme-toggle" id="replayTourBtn" aria-label="Replay the color tour with sound" title="Replay with sound">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
        </button>
        <button type="button" class="theme-toggle" id="themeToggleBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M5 5l1.5 1.5M17.5 17.5L19 19M3 12h2M19 12h2M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      </button>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="hub-tabs" id="hubTabs">
    <button type="button" class="hub-tab active" data-tab="MISMO Initiatives">MISMO Initiatives<span class="tab-count" id="countActive"></span></button>
    <button type="button" class="hub-tab" data-tab="Potential Initiatives">Potential Initiatives<span class="tab-count" id="countPotential"></span></button>
  </div>

  <div id="initiativesTabContent">
    <div class="tile-grid" id="tileGrid"></div>
    <div id="panelArea"></div>
  </div>
  <div id="placeholderTabContent" style="display:none;"></div>
</div>

<script>
  function escapeHtml(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const initiatives = [
    {
      title: 'Mortgage Compliance Dataset', domains: ['Mortgage Compliance'], status: 'live', href: 'mcd-dashboard.html', sample: false,
      whatIsIt: 'A standard set of loan data fields and delivery file format that mortgage lenders and independent mortgage banks provide to regulators for the loan-level review portion of regulatory compliance examinations — designed to replace the Loan Examination File (LEF).',
      whyWorking: ['Manual, inconsistent reviews slow examinations down.', 'Inconsistent formats break compliance technology.', 'Lenders want to catch issues before the exam.'],
      whoBroughtIt: 'MISMO, in partnership with CSBS · sponsored by Asurity · Version 2.0 published Dec 11, 2025',
      publicationStatus: 'Published — Version 2.0',
      estimatedSavings: 'No published $ estimate yet'
    },
    {
      title: 'Common Confidence Score', domains: ['Originations', 'Valuation'], status: 'live', href: 'ccs-dashboard.html', sample: false,
      whatIsIt: 'A standardized probability score — the estimated likelihood an AVM value falls within ±10% of market value — that lets lenders and investors compare valuation risk across different AVM providers on one common scale, replacing inconsistent provider-specific confidence formats.',
      whyWorking: ['Inconsistent scores make AVMs hard to compare.', 'The accurate alternative is too complex to adopt.', 'A 2024 federal rule raised the stakes.'],
      whoBroughtIt: 'AVM providers &amp; the Mortgage Bankers Association, in response to the CFPB\'s AVM quality control rule — though that rule is not currently being enforced · Reached Recommendation status April 21, 2026',
      publicationStatus: 'Published — though the federal rule it responds to is not currently being enforced',
      estimatedSavings: 'No published $ figure — sources describe reduced QC costs and faster valuation decisions only'
    },
    {
      title: 'AVM Accuracy Testing Guidelines', domains: ['Valuation'], status: 'planned', href: null, sample: false,
      whatIsIt: 'Best-practice guidelines for testing AVM accuracy, giving small and mid-sized lenders a standardized baseline to start from instead of building a testing process from scratch in-house or through an outside consultant.',
      whyWorking: ['Federal rules require regular accuracy testing to use AVMs, but smaller lenders often lack the resources to build their own process.', 'Without shared guidelines, each lender rebuilds the same testing framework independently, raising costs that get passed on to consumers.', 'Standardized practices lower the barrier to AVM adoption for smaller institutions.'],

  // one collapses that whole row. Rows are a CSS Grid concept with no DOM
  // equivalent, so the row has to be derived at click time.
  //
  // Column count comes from the grid's *computed* gridTemplateColumns, which
  // resolves to one length per column (e.g. "341px 341px 341px") and already
  // reflects whichever media-query breakpoint is currently active — so this
  // follows the 3 / 2 / 1 column responsive steps with no hardcoded widths.
  //
  // Deliberately not grouping by geometry (comparing each card's offsetTop):
  // cards that sit in the same visual row have been observed reporting tops a
  // few px apart in this layout, which would silently split a row.
  function toggleRowDetails(btn){
    const card = btn.closest('.init-card');
    const grid = card.closest('.init-grid');
    if (!card || !grid) return;

    const cards = Array.from(grid.querySelectorAll('.init-card'));
    const idx = cards.indexOf(card);
    if (idx === -1) return;

    const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length || 1;
    const rowStart = Math.floor(idx / cols) * cols;
    const rowCards = cards.slice(rowStart, rowStart + cols);

    // Resolve the target state once from the clicked card, then apply that same
    // state to every card in the row, rather than toggling each independently —
    // so the row always ends up consistent even if it somehow started mixed.
    const willOpen = !card.classList.contains('expanded');

    rowCards.forEach(c => {
      const body = c.querySelector('.expand-body');
      const toggle = c.querySelector('.expand-toggle');
      if (!body || !toggle) return;
      body.classList.toggle('open', willOpen);
      c.classList.toggle('expanded', willOpen);
      const label = toggle.querySelector('.expand-label');
      const chevron = toggle.querySelector('.expand-chevron');
      if (label) label.textContent = willOpen ? 'Hide additional details' : 'See additional details';
      if (chevron) chevron.classList.toggle('open', willOpen);
    });

  function playTone(freq, startTime, duration, ctx){

    osc.connect(gainNode);
    gainNode.connect(ctx.destination);

    // Soft attack/release so each tone feels muted rather than a hard beep.
    const peak = 0.12;
    gainNode.gain.setValueAtTime(0, startTime);
    gainNode.gain.linearRampToValueAtTime(peak, startTime + 0.08);
    gainNode.gain.setValueAtTime(peak, startTime + duration - 0.15);
    gainNode.gain.linearRampToValueAtTime(0, startTime + duration);

    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function playIntroColorTour(withSound){
    const tiles = [...tileGrid.querySelectorAll('.domain-tile')];
    // Group tiles into visual rows based on their actual rendered top offset,
    // then sort each row left-to-right, so this adapts correctly at any screen
    // width (3 columns, 2, or 1) rather than assuming a fixed grid shape.
    const rows = [];
    tiles.forEach(tile => {
      const top = tile.offsetTop;
      let row = rows.find(r => Math.abs(r.top - top) < 5);
      if (!row){
        row = { top, tiles: [] };
        rows.push(row);
      }
      row.tiles.push(tile);
    });
    rows.forEach(row => row.tiles.sort((a, b) => a.offsetLeft - b.offsetLeft));

    // Ascending phase groups: split tiles by position relative to the main
    // diagonal (top-left to bottom-right) of the row/column grid — below it,
    // on it, then above it. With a 3x3 layout this is exactly:
    //   below: eMortgage, Secondary, Servicing
    //   on:    Artificial Intelligence, Governance, Valuation
    //   above: Compliance, Credit Reporting, Originations
    const belowDiagonal = [], onDiagonal = [], aboveDiagonal = [];
    rows.forEach((row, r) => {
      row.tiles.forEach((tile, c) => {
        if (r > c) belowDiagonal.push(tile);
        else if (r === c) onDiagonal.push(tile);
        else aboveDiagonal.push(tile);
      });
    });
    const diagonalGroups = [belowDiagonal, onDiagonal, aboveDiagonal].filter(g => g.length);

    const descendMs = 975; // 35% faster than the original 1500ms cadence
    const ascendMs = 500; // quicker cadence for the ascending phase

    // Descending tones (one per row, high to low), then ascending tones
    // (one per diagonal group, low to high) — Close Encounters-ish.
    // Dropped one octave from the original pitch per earlier feedback.
    const descendNotes = [440.00, 293.66, 220.00]; // A4, D4, A3
    const ascendNotes = [261.63, 329.63, 392.00]; // C4, E4, G4

    // withSound is true whenever this runs — the tour is only ever triggered by
    // the replay button's click handler now, which is always a genuine gesture.
    const ctx = withSound ? getAudioContext() : null;
    function audioIsLive(){ return ctx && ctx.state === 'running'; }

    function highlightGroup(tileGroup, freq, duration, holdMs, className){
      tileGroup.forEach(tile => tile.classList.add(className));
      if (audioIsLive()) playTone(freq, ctx.currentTime, duration, ctx);
      setTimeout(() => {
        tileGroup.forEach(tile => tile.classList.remove(className));
      }, holdMs);
    }

    // Descending: one row at a time, ~1s apart (35% faster than the original
    // 1.5s cadence, per feedback) — still a gradual fade, just a brisker one.
    rows.forEach((row, i) => {
      setTimeout(() => {
        highlightGroup(row.tiles, descendNotes[i] || descendNotes[descendNotes.length - 1], 0.585, descendMs, 'intro-highlight-slow');
      }, i * descendMs);
    });

    // Ascending: one diagonal group at a time, starting after the descending
    // phase finishes, at a quicker cadence — keeps the snappier fade.
    const ascendStart = rows.length * descendMs + 200;
    diagonalGroups.forEach((group, i) => {
      setTimeout(() => {
        highlightGroup(group, ascendNotes[i] || ascendNotes[ascendNotes.length - 1], 0.35, ascendMs, 'intro-highlight');
      }, ascendStart + i * ascendMs);
    });
  }

  // The tour now only ever runs when this button is clicked — nothing plays
  // automatically on page load, visuals or sound. A direct click is a genuine
  // user gesture, so audio is reliably allowed here every time.
  // A freshly-created AudioContext can have a brief startup lag before its very
  // first audible sound — the underlying audio hardware path needs a moment to
  // spin up. Without accounting for this, the first descending tone on the very
  // first play can noticeably lag behind its visual highlight. Playing an
  // inaudible tone immediately after resume, then giving it a brief moment
  // before the real tour starts, avoids that — but only needs to happen once.
  let audioWarmedUp = false;
  function primeAudio(ctx){
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    gainNode.gain.value = 0.0001;
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.02);
  }

  const replayBtn = document.getElementById('replayTourBtn');
  // Guards against a rapid double-click stacking two tours' setTimeouts and class
  // toggles on top of each other. 10s is a generous upper bound - even the longest
  // case (9 rows on a narrow mobile layout, each 975ms apart, plus the ascending
  // phase after) finishes well within it.
  let tourRunning = false;
  if (replayBtn){
    replayBtn.addEventListener('click', async () => {
      if (tourRunning) return;
      tourRunning = true;
      setTimeout(() => { tourRunning = false; }, 10000);
      const ctx = getAudioContext();
      if (ctx && ctx.state === 'suspended'){
        try {
          await ctx.resume();
        } catch (err) {
          // If resume() is ever rejected, fall through anyway — the tour still
          // runs visually, and audioIsLive() checks the real state at each
          // step rather than assuming this succeeded.
        }
      }
      if (ctx && !audioWarmedUp){
        audioWarmedUp = true;
        primeAudio(ctx);
        setTimeout(() => playIntroColorTour(true), 120);
      } else {
        playIntroColorTour(true);
      }
    });
  }

  // Dark mode: check for a saved preference (this is a real hosted site, not a
  // sandboxed preview, so localStorage works normally and persists across visits).
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggleBtn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
  }
  let savedTheme = 'light';
  try {
    savedTheme = localStorage.getItem('tools:hub:theme') || 'light';
  } catch (e) {
    // Local storage unavailable — just default to light mode.
  }
  applyTheme(savedTheme);

  themeToggleBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try {
      localStorage.setItem('tools:hub:theme', next);
    } catch (e) {
      // Local storage unavailable — the toggle still works, it just won't persist.
    }
  });
</script>

</body>
</html>
